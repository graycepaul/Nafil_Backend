# Reverse proxy for the self-hosted VPS.
# Routes /auth, /rest, /storage, /realtime to Supabase's Kong gateway,
# and everything else to the FastAPI backend - so SUPABASE_URL and the
# mobile app's Supabase client can both keep pointing at one domain.

upstream supabase_kong {
    server 127.0.0.1:8000;   # Kong's default port in the self-hosted supabase compose
}

upstream nafil_api {
    server 127.0.0.1:8010;   # published port for the api container, see README
}

# Zone sizes are keyed by $binary_remote_addr (client IP): 10m ~= 160k
# tracked addresses, far beyond what this app's traffic needs.
#
# - auth_zone: Supabase's own login/signup/password-reset endpoints. No
#   rate limiting existed here at all before - wide open to credential
#   stuffing and signup-based email enumeration.
# - internal_zone: /push/notify-user and /push/notify-batch are meant only
#   for this VPS's own Postgres trigger to call, authenticated by a shared
#   secret rather than a user session - a tight limit here means a leaked
#   or guessed secret still can't be hammered into a spam/DoS vector.
# - api_zone: general backend traffic (mostly authenticated, JWT-checked
#   per-endpoint) - loose enough not to interfere with real usage, still a
#   backstop against a runaway client or naive scraper.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=internal_zone:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;

server {
    listen 80;
    server_name api.nafilestates.com vps.nafilestates.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.nafilestates.com vps.nafilestates.com;

    # api.nafilestates.com is the real production domain (post-cutover);
    # vps.nafilestates.com kept as an alias for the original test setup.
    # One cert covers both, but it's saved under the *original* lineage
    # name (vps.nafilestates.com) since certbot --expand extends an
    # existing lineage rather than starting a new one - the cert itself
    # is valid for both domains regardless of which folder it lives in.
    ssl_certificate     /etc/letsencrypt/live/vps.nafilestates.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps.nafilestates.com/privkey.pem;

    client_max_body_size 20m;

    # Baseline hardening headers. HSTS is safe here since every server_name
    # this cert covers is already HTTPS-only (the :80 block above does
    # nothing but redirect) - no plain-HTTP use case to break.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Supabase's own auth routes specifically - tighter limit than the rest
    # of /auth|rest|storage|realtime (login/signup/password-reset abuse is
    # the actual risk; token refresh and other authenticated /auth calls
    # ride the looser api_zone below instead).
    location ~ ^/auth/v1/(token|signup|recover|otp) {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://supabase_kong;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Supabase's own routes - Auth, PostgREST, Storage, Realtime
    # Envoy (the api-gw container) rejects nginx's default HTTP/1.0 upstream
    # connection with 426 Upgrade Required - proxy_http_version 1.1 is required.
    location ~ ^/(auth|rest|storage|realtime)/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://supabase_kong;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Internal-only: the pg_net trigger calling itself over the public
    # domain (Postgres has no other route out). Shared-secret checked
    # app-side (app/routers/push.py) - this is a second, network-level
    # backstop, not the only defense.
    location ~ ^/push/notify-(user|batch)$ {
        limit_req zone=internal_zone burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://nafil_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else - the FastAPI backend
    location / {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://nafil_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
